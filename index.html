<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handled — Korean local guide matching</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ─────────────────────────────────────────────
       Tokens (per DESIGN.md — Airbnb-derived)
       ───────────────────────────────────────────── */
    :root {
      /* color */
      --canvas: #ffffff;
      --surface-soft: #f7f7f7;
      --surface-strong: #f2f2f2;
      --hairline: #dddddd;
      --hairline-soft: #ebebeb;
      --border-strong: #c1c1c1;

      --ink: #222222;
      --body: #3f3f3f;
      --muted: #6a6a6a;
      --muted-soft: #929292;
      --on-primary: #ffffff;

      --rausch: #ff385c;
      --rausch-active: #e00b41;
      --rausch-disabled: #ffd1da;
      --error: #c13515;
      --error-hover: #b32505;

      /* radius */
      --r-sm: 8px;
      --r-md: 14px;
      --r-lg: 32px;
      --r-full: 9999px;

      /* shadow — single tier */
      --shadow-card:
        rgba(0, 0, 0, 0.02) 0 0 0 1px,
        rgba(0, 0, 0, 0.04) 0 2px 6px 0,
        rgba(0, 0, 0, 0.1) 0 4px 8px 0;

      /* spacing */
      --s-xxs: 2px;
      --s-xs: 4px;
      --s-sm: 8px;
      --s-md: 12px;
      --s-base: 16px;
      --s-lg: 24px;
      --s-xl: 32px;
      --s-xxl: 48px;
      --s-section: 64px;

      /* typography */
      --font:
        'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
        system-ui, Roboto, 'Helvetica Neue', sans-serif;
    }

    /* ─────────────────────────────────────────────
       Reset + base
       ───────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }
    body {
      font-family: var(--font);
      font-feature-settings: 'ss06' on, 'ss07' on, 'ss10' on;
      color: var(--ink);
      background: var(--canvas);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      min-width: 320px;
    }
    img {
      display: block;
      max-width: 100%;
    }
    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      background: none;
      color: inherit;
    }
    input,
    textarea,
    select {
      font-family: inherit;
      outline: none;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--hairline);
      border-radius: 4px;
    }

    /* ─────────────────────────────────────────────
       Typography (per DESIGN.md scale)
       ───────────────────────────────────────────── */
    .t-rating {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -1px;
    }
    .t-display-xl {
      font-size: clamp(26px, 4.4vw, 44px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -1px;
      overflow-wrap: anywhere;
    }
    .t-display-lg {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: -0.44px;
    }
    .t-display-md {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.4;
    }
    .t-display-sm {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.18px;
    }
    .t-title-md {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
    }
    .t-title-sm {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.25;
    }
    .t-body-md {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
    }
    .t-body-sm {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.43;
    }
    .t-caption {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.29;
    }
    .t-caption-sm {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.23;
    }
    .t-badge {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.18;
    }
    .t-uppercase-tag {
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.32px;
      text-transform: uppercase;
    }

    .ink {
      color: var(--ink);
    }
    .body {
      color: var(--body);
    }
    .muted {
      color: var(--muted);
    }
    .muted-soft {
      color: var(--muted-soft);
    }

    /* ─────────────────────────────────────────────
       Layout primitives
       ───────────────────────────────────────────── */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 40px;
    }
    @media (max-width: 744px) {
      .container {
        padding: 0 20px;
      }
    }

    .stack-xs { display: flex; flex-direction: column; gap: 4px; }
    .stack-sm { display: flex; flex-direction: column; gap: 8px; }
    .stack-md { display: flex; flex-direction: column; gap: 12px; }
    .stack-base { display: flex; flex-direction: column; gap: 16px; }
    .stack-lg { display: flex; flex-direction: column; gap: 24px; }
    .stack-xl { display: flex; flex-direction: column; gap: 32px; }

    .row {
      display: flex;
      align-items: center;
    }
    .row-gap-xs { gap: 4px; }
    .row-gap-sm { gap: 8px; }
    .row-gap-md { gap: 12px; }
    .row-gap-base { gap: 16px; }
    .row-gap-lg { gap: 24px; }
    .between {
      justify-content: space-between;
    }
    .end { justify-content: flex-end; }
    .center { justify-content: center; }

    /* ─────────────────────────────────────────────
       Buttons
       ───────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: var(--r-sm);
      font-size: 16px;
      font-weight: 500;
      padding: 14px 24px;
      transition: background 0.15s ease, color 0.15s ease, transform 0.05s ease;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--rausch);
      color: var(--on-primary);
    }
    .btn-primary:hover {
      background: var(--rausch-active);
    }
    .btn-primary:active {
      transform: scale(0.99);
    }
    .btn-primary:disabled {
      background: var(--rausch-disabled);
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--canvas);
      color: var(--ink);
      border: 1px solid var(--ink);
    }
    .btn-secondary:hover {
      background: var(--surface-soft);
    }
    .btn-tertiary {
      padding: 8px 12px;
      background: transparent;
      color: var(--ink);
      font-weight: 500;
      border-radius: var(--r-sm);
    }
    .btn-tertiary:hover {
      background: var(--surface-soft);
    }
    .btn-pill {
      border-radius: var(--r-full);
      padding: 10px 20px;
      font-size: 14px;
    }
    .btn-block {
      width: 100%;
    }

    /* icon-only circular button */
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--r-full);
      background: var(--surface-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover {
      background: var(--hairline);
    }

    /* ─────────────────────────────────────────────
       Inputs
       ───────────────────────────────────────────── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }
    .input {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--r-sm);
      border: 1px solid var(--hairline);
      background: var(--canvas);
      font-size: 16px;
      color: var(--ink);
      transition: border-color 0.15s;
    }
    .input::placeholder {
      color: var(--muted-soft);
    }
    .input:focus {
      border: 2px solid var(--ink);
      padding: 13px 15px;
    }
    .input.error {
      border-color: var(--error);
    }
    .help-error {
      font-size: 12px;
      color: var(--error);
      margin-top: 4px;
    }

    /* ─────────────────────────────────────────────
       Tag / Badge / Chip
       ───────────────────────────────────────────── */
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: var(--r-full);
      background: var(--canvas);
      box-shadow: var(--shadow-card);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: var(--r-full);
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 500;
      color: var(--body);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--r-full);
      border: 1px solid var(--hairline);
      background: var(--canvas);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .chip:hover {
      border-color: var(--ink);
    }
    .chip.active {
      background: var(--ink);
      color: var(--on-primary);
      border-color: var(--ink);
    }

    /* ─────────────────────────────────────────────
       Cards
       ───────────────────────────────────────────── */
    .card {
      background: var(--canvas);
      border-radius: var(--r-md);
      border: 1px solid var(--hairline-soft);
      overflow: hidden;
    }
    .card-pad-lg {
      padding: 24px;
    }

    /* ─────────────────────────────────────────────
       Animations
       ───────────────────────────────────────────── */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .fade-in {
      animation: fadeIn 0.25s ease;
    }

    /* ─────────────────────────────────────────────
       NAV
       ───────────────────────────────────────────── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--canvas);
      border-bottom: 1px solid var(--hairline-soft);
      height: 80px;
      display: flex;
      align-items: center;
    }
    .nav-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      width: 100%;
    }
    .nav-logo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 32px;
      justify-content: center;
    }
    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 4px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      position: relative;
      cursor: pointer;
    }
    .nav-tab.active {
      color: var(--ink);
    }
    .nav-tab.active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -8px;
      height: 2px;
      background: var(--ink);
      border-radius: 2px;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }
    .nav-host-link {
      padding: 12px 16px;
      border-radius: var(--r-full);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
    }
    .nav-host-link:hover {
      background: var(--surface-soft);
    }
    .nav-account {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px 6px 14px;
      border-radius: var(--r-full);
      border: 1px solid var(--hairline);
      background: var(--canvas);
      transition: box-shadow 0.15s;
    }
    .nav-account:hover {
      box-shadow: var(--shadow-card);
    }
    .nav-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--r-full);
      background: var(--muted);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ─────────────────────────────────────────────
       Search pill
       ───────────────────────────────────────────── */
    .search-pill {
      display: flex;
      align-items: center;
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--r-full);
      box-shadow: var(--shadow-card);
      padding: 6px 6px 6px 24px;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      transition: box-shadow 0.15s;
      min-width: 0;
    }
    @media (max-width: 744px) {
      .search-pill {
        display: none;
      }
    }
    .search-pill-mobile {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--r-full);
      box-shadow: var(--shadow-card);
      padding: 14px 20px;
      width: 100%;
    }
    @media (max-width: 744px) {
      .search-pill-mobile {
        display: flex;
      }
    }
    .search-pill-mobile input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font-size: 14px;
      color: var(--ink);
    }
    .search-pill:hover {
      box-shadow:
        rgba(0, 0, 0, 0.05) 0 0 0 1px,
        rgba(0, 0, 0, 0.08) 0 4px 12px 0,
        rgba(0, 0, 0, 0.18) 0 6px 14px 0;
    }
    .search-segment {
      padding: 8px 16px;
      border-right: 1px solid var(--hairline);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      cursor: pointer;
    }
    .search-segment input {
      width: 100%;
      min-width: 0;
    }
    .search-segment:last-of-type {
      border-right: none;
    }
    .search-segment .seg-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 2px;
    }
    .search-segment .seg-value {
      font-size: 14px;
      color: var(--muted-soft);
    }
    .search-segment .seg-value.has-value {
      color: var(--ink);
    }
    .search-orb {
      width: 48px;
      height: 48px;
      border-radius: var(--r-full);
      background: var(--rausch);
      color: var(--on-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .search-orb:hover {
      background: var(--rausch-active);
    }
    .search-orb.expanded {
      width: auto;
      padding: 0 16px;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    /* ─────────────────────────────────────────────
       Guide card (marketplace listing)
       ───────────────────────────────────────────── */
    .guide-card {
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .guide-card:hover {
      transform: translateY(-2px);
    }
    .guide-card-photo {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--surface-soft);
    }
    .guide-card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .guide-card:hover .guide-card-photo img {
      transform: scale(1.04);
    }
    .heart-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: var(--r-full);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: white;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
    }
    .heart-btn:hover {
      transform: scale(1.05);
    }
    .superhost-badge {
      position: absolute;
      top: 12px;
      left: 12px;
    }
    .guide-card-meta {
      padding: 12px 4px 0;
    }

    /* ─────────────────────────────────────────────
       Reservation panel (sticky, profile screen)
       ───────────────────────────────────────────── */
    .reservation {
      position: sticky;
      top: 100px;
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-card);
      padding: 24px;
    }
    .res-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: var(--surface-soft);
      border-radius: var(--r-sm);
    }
    .res-tab {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .res-tab.active {
      background: var(--canvas);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .stepper-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
      padding: 14px 16px;
    }
    .exp-pill {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--hairline);
      background: var(--canvas);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-align: left;
    }
    .exp-pill:hover {
      border-color: var(--ink);
    }
    .exp-pill.active {
      border-color: var(--rausch);
      background: #fff8f9;
    }
    /* ─────────────────────────────────────────────
       Experience card (profile page)
       ───────────────────────────────────────────── */
    .exp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .exp-card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--canvas);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.15s;
    }
    .exp-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }
    .exp-card.active {
      border-color: var(--rausch);
      box-shadow:
        0 0 0 2px var(--rausch),
        var(--shadow-card);
    }
    .exp-card-photo {
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: var(--surface-soft);
      position: relative;
    }
    .exp-card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .exp-card:hover .exp-card-photo img {
      transform: scale(1.04);
    }
    .exp-card-cat {
      position: absolute;
      top: 10px;
      left: 10px;
    }
    .exp-card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .exp-card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }
    /* ─────────────────────────────────────────────
       Experience detail — schedule + meeting place
       ───────────────────────────────────────────── */
    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .schedule-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      border-radius: var(--r-md);
      transition: background 0.15s;
    }
    .schedule-item:hover {
      background: var(--surface-soft);
    }
    .schedule-item-photo {
      width: 96px;
      height: 96px;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      overflow: hidden;
      background: var(--surface-soft);
    }
    .schedule-item-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .schedule-step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--on-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .host-mini-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      background: var(--canvas);
    }
    .host-mini-card-link {
      padding: 10px 16px;
      border: 1px solid var(--ink);
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .host-mini-card-link:hover {
      background: var(--surface-soft);
    }
    .meet-map {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--r-md);
      background:

       CALENDAR (used inside Reservation panel)
       ═══════════════════════════════════════════════ */
    const Calendar = ({ value, onChange, minDate }) => {
      const [view, setView] = useState(() => {
        const d = value || new Date();
        return new Date(d.getFullYear(), d.getMonth(), 1);
      });

      const monthLabel = `${['January','February','March','April','May','June','July','August','September','October','November','December'][view.getMonth()]} ${view.getFullYear()}`;
      const startDow = view.getDay();
      const daysInMonth = new Date(
        view.getFullYear(),
        view.getMonth() + 1,
        0
      ).getDate();

      const cells = [];
      for (let i = 0; i < startDow; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++)
        cells.push(new Date(view.getFullYear(), view.getMonth(), d));

      const isSame = (a, b) =>
        a &&
        b &&
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();

      const today = minDate || new Date();
      today.setHours(0, 0, 0, 0);

      const goPrev = () =>
        setView(new Date(view.getFullYear(), view.getMonth() - 1, 1));
      const goNext = () =>
        setView(new Date(view.getFullYear(), view.getMonth() + 1, 1));

      const dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      return (
        <div className="cal">
          <div className="cal-head">
            <button
              onClick={goPrev}
              className="icon-btn"
              aria-label="Previous month"
              style={{ background: 'transparent' }}
            >
              <Icon name="chevronLeft" size={16} />
            </button>
            <div className="t-title-sm ink">{monthLabel}</div>
            <button
              onClick={goNext}
              className="icon-btn"
              aria-label="Next month"
              style={{ background: 'transparent' }}
            >
              <Icon name="chevronRight" size={16} />
            </button>
          </div>
          <div className="cal-grid" style={{ marginBottom: 4 }}>
            {dows.map((d, i) => (
              <div key={i} className="cal-dow">
                {d}
              </div>
            ))}
          </div>
          <div className="cal-grid">
            {cells.map((c, i) =>
              c === null ? (
                <span key={i} />
              ) : (
                <button
                  key={i}
                  className={`cal-day ${isSame(c, value) ? 'selected' : ''}`}
                  disabled={c < today}
                  onClick={() => onChange(c)}
                >
                  {c.getDate()}
                </button>
              )
            )}
          </div>
        </div>
      );
    };

                <div className="divider" />

                {/* meeting place */}
                <h2 className="t-display-sm ink" style={{ marginBottom: 16 }}>
                  Meeting place
                </h2>
                <div className="meet-map" style={{ marginBottom: 12 }}>
                  <div className="meet-pin">
                    <Icon name="pin" size={16} stroke="var(--rausch)" />
                    <span className="t-body-sm ink" style={{ fontWeight: 500 }}>
                      {guide.district}
                    </span>
                  </div>
                </div>
                <p className="t-body-sm muted" style={{ marginBottom: 32 }}>
                  {meetingPlace(exp, guide)}
                </p>

                <div className="divider" />

                {/* know before you go */}
                <h2 className="t-display-sm ink" style={{ marginBottom: 16 }}>
                  Good to know
                </h2>
                <div className="info-grid" style={{ marginBottom: 32 }}>
                  <div className="info-grid-item">
                    <div className="info-grid-item-icon">
                      <Icon name="users" size={18} />
                    </div>
                    <div>
                      <div className="t-title-sm ink" style={{ marginBottom: 4 }}>
                        Group size
                      </div>
                      <div className="t-body-sm muted">
                        Up to {exp.maxGuests} (small group)
                      </div>
                    </div>
                  </div>
                  <div className="info-grid-item">
                    <div className="info-grid-item-icon">
                      <Icon name="clock" size={18} />
                    </div>
                    <div>
                      <div className="t-title-sm ink" style={{ marginBottom: 4 }}>
                        Duration
                      </div>
                      <div className="t-body-sm muted">{exp.duration} hours</div>
                    </div>
                  </div>
                  <div className="info-grid-item">
                    <div className="info-grid-item-icon">
                      <Icon name="globe" size={18} />
                    </div>
                    <div>
                      <div className="t-title-sm ink" style={{ marginBottom: 4 }}>
                        Language
                      </div>
                      <div className="t-body-sm muted">
                        {guide.languages.join(' · ')}
                      </div>
                    </div>
                  </div>
                  <div className="info-grid-item">
                    <div className="info-grid-item-icon">
                      <Icon name="shield" size={18} />
                    </div>
                    <div>
                      <div className="t-title-sm ink" style={{ marginBottom: 4 }}>
                        Cancellation
                      </div>
                      <div className="t-body-sm muted">
                        Free cancellation up to 24h before
                      </div>
                    </div>
                  </div>
                </div>

                <div className="divider" />

                {/* reviews */}
                <h2 className="t-display-sm ink" style={{ marginBottom: 8 }}>
                  <Icon
                    name="star"
                    size={18}
                    fill="var(--ink)"
                    stroke="var(--ink)"
                    style={{ display: 'inline-block', verticalAlign: '-3px' }}
                  />{' '}
                  {guide.rating.toFixed(2)} · {guide.reviews} reviews
                </h2>
                <p className="t-caption-sm muted" style={{ marginBottom: 24 }}>
                  Reviews for all experiences hosted by {guide.name}
                </p>
                <div className="review-grid">
                  {reviews.slice(0, 4).map((r, i) => (
                    <div key={i}>
                      <div
                        className="row row-gap-sm"
                        style={{ marginBottom: 8 }}
                      >
                        <Avatar size={36} name={r.name} src="" />
                        <div>
                          <div className="t-title-sm ink">{r.name}</div>
                          <div className="t-caption-sm muted">{r.country}</div>
                        </div>
                      </div>
                      <Stars rating={r.rating} />
                      <p
                        className="t-body-sm body"
                        style={{ marginTop: 8 }}
                      >
                        "{r.text}"
                      </p>
                      <div
                        className="t-caption-sm muted-soft"
                        style={{ marginTop: 6 }}
                      >
                        {r.date}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* RIGHT — Experience booking panel */}
              <ExpBookingPanel exp={exp} guide={guide} onReserve={onReserve} />
            </div>
          </div>
        </main>
      );
    };

    /* ═══════════════════════════════════════════════
       PAYMENT SCREEN
       ═══════════════════════════════════════════════ */
    const PaymentScreen = ({ booking, navigate, onConfirm }) => {
      const [name, setName] = useState('');
      const [card, setCard] = useState('');
      const [exp, setExp] = useState('');
      const [cvc, setCvc] = useState('');
      const [zip, setZip] = useState('');
      const [errs, setErrs] = useState({});
      const [loading, setLoading] = useState(false);

      if (!booking) {
        return (
          <main className="fade-in">
            <div className="container" style={{ padding: '64px 0' }}>
              <p className="t-body-md muted">No booking information.</p>
              <button
                className="btn btn-secondary"
                onClick={() => navigate('home')}
                style={{ marginTop: 16 }}
              >
                Home
              </button>
            </div>
          </main>
        );
      }

      const { guide } = booking;

      const fmtCard = (v) =>
        v
          .replace(/\D/g, '')
          .replace(/(.{4})/g, '$1 ')
          .trim()
          .slice(0, 19);
      const fmtExp = (v) =>
        v.replace(/\D/g, '').replace(/^(.{2})(.+)/, '$1/$2').slice(0, 5);

      const validate = () => {
        const e = {};
        if (!name.trim()) e.name = 'Enter the cardholder name';
        if (card.replace(/\s/g, '').length < 16) e.card = 'Enter a 16-digit card number';
        if (!/^\d{2}\/\d{2}$/.test(exp)) e.exp = 'MM/YY format';
        if (cvc.length < 3) e.cvc = '3-digit CVC';
        if (!zip.trim()) e.zip = 'Enter ZIP code';
        setErrs(e);
        return Object.keys(e).length === 0;
      };

      const submit = () => {
        if (!validate()) return;
        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          onConfirm({
            ...booking,
            payerName: name,
            cardLast4: card.slice(-4),
            bookingId: 'HD-' + Math.random().toString(36).slice(2, 8).toUpperCase(),
          });
        }, 1500);
      };

      return (
        <main className="fade-in">
          <div className="container" style={{ padding: '24px 0 64px' }}>
            <div
              className="row row-gap-sm"
              style={{ marginBottom: 16, color: 'var(--muted)', cursor: 'pointer', width: 'fit-content' }}
              onClick={() =>
                booking.experience
                  ? navigate('experience', { expId: booking.experience.id })
                  : navigate('profile', { guideId: guide.id })
              }
            >
              <Icon name="arrowLeft" size={16} />
              <span className="t-body-sm">
                {booking.experience ? 'Back to experience' : 'Back to guide'}
              </span>
            </div>

            <h1 className="t-display-md ink" style={{ marginBottom: 32 }}>
              Checkout
            </h1>

            <div className="pay-grid">
              {/* Form */}
              <div>
                {/* trip details */}
                <div style={{ marginBottom: 32 }}>
                  <h2 className="t-display-sm ink" style={{ marginBottom: 16 }}>
                    Booking summary
                  </h2>
                  <div
                    className="stack-md"
                    style={{
                      padding: 20,
                      border: '1px solid var(--hairline)',
                      borderRadius: 'var(--r-md)',
                    }}
                  >
                    <div className="row between">
                      <span className="t-body-sm body">Type</span>
                      <span
                        className="t-body-md"
                        style={{
                          fontWeight: 600,
                          color: 'var(--rausch)',
                        }}
                      >
                        {booking.experience ? 'Experience package' : 'Custom tour'}
                      </span>
                    </div>
                    {booking.experience && (
                      <div className="row between" style={{ alignItems: 'flex-start', gap: 16 }}>
                        <span className="t-body-sm body" style={{ flexShrink: 0 }}>
                          Experience
                        </span>
                        <span
                          className="t-body-md ink"
                          style={{
                            fontWeight: 500,
                            textAlign: 'right',
                            flex: 1,
                            minWidth: 0,
                            overflowWrap: 'anywhere',
                          }}
                        >
                          {booking.experience.title}
                        </span>
                      </div>
                    )}
                    <div className="row between">
                      <span className="t-body-sm body">Date</span>
                      <span className="t-body-md ink" style={{ fontWeight: 500 }}>
                        {formatDate(booking.date)}
                      </span>
                    </div>
                    <div className="row between">
                      <span className="t-body-sm body">Time</span>
                      <span className="t-body-md ink" style={{ fontWeight: 500 }}>
                        {booking.time} · {booking.hours} hours
                      </span>
                    </div>
                    <div className="row between">
                      <span className="t-body-sm body">Guests</span>
                      <span className="t-body-md ink" style={{ fontWeight: 500 }}>
                        {booking.guests} {booking.guests === 1 ? 'guest' : 'guests'}
                      </span>
                    </div>
                    {booking.interests && booking.interests.length > 0 && (
                      <div
                        className="row between"
                        style={{ alignItems: 'flex-start', gap: 16, flexWrap: 'wrap' }}
                      >
                        <span className="t-body-sm body" style={{ flexShrink: 0 }}>
                          Interests
                        </span>
                        <div
                          className="row"
                          style={{
                            gap: 4,
                            flexWrap: 'wrap',
                            justifyContent: 'flex-end',
                            flex: 1,
                          }}
                        >
                          {booking.interests.map((i) => (
                            <span key={i} className="tag">
                              {i}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}
                    {booking.requests && (
                      <div
                        className="stack-xs"
                        style={{
                          paddingTop: 8,
                          borderTop: '1px solid var(--hairline-soft)',
                        }}
                      >
                        <span className="t-caption muted">Special requests</span>
                        <span className="t-body-sm ink">{booking.requests}</span>
                      </div>
                    )}
                  </div>
                </div>

                {/* card form */}
                <h2 className="t-display-sm ink" style={{ marginBottom: 16 }}>
                  Payment method
                </h2>
                <div className="stack-base" style={{ marginBottom: 32 }}>
                  <div className="field">
                    <label>Cardholder name</label>
                    <input
                      className={`input ${errs.name ? 'error' : ''}`}
                      placeholder="HONG GILDONG"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                    />
                    {errs.name && <span className="help-error">{errs.name}</span>}
                  </div>
                  <div className="field">
                    <label>Card number</label>
                    <input
                      className={`input ${errs.card ? 'error' : ''}`}
                      placeholder="1234 5678 9012 3456"
                      value={card}
                      onChange={(e) => setCard(fmtCard(e.target.value))}
                      inputMode="numeric"
                    />
                    {errs.card && <span className="help-error">{errs.card}</span>}
                  </div>
                  <div className="pay-card-row">
                    <div className="field">
                      <label>Expiry</label>
                      <input
                        className={`input ${errs.exp ? 'error' : ''}`}
                        placeholder="MM/YY"
                        value={exp}
                        onChange={(e) => setExp(fmtExp(e.target.value))}
                        inputMode="numeric"
                      />
                      {errs.exp && <span className="help-error">{errs.exp}</span>}
                    </div>
                    <div className="field">
                      <label>CVC</label>
                      <input
                        className={`input ${errs.cvc ? 'error' : ''}`}
                        placeholder="123"
                        value={cvc}
                        onChange={(e) =>
                          setCvc(e.target.value.replace(/\D/g, '').slice(0, 4))
                        }
                        inputMode="numeric"
                      />
                      {errs.cvc && <span className="help-error">{errs.cvc}</span>}
                    </div>
                    <div className="field">
                      <label>ZIP code</label>
                      <input
                        className={`input ${errs.zip ? 'error' : ''}`}
                        placeholder="10001"
                        value={zip}
                        onChange={(e) => setZip(e.target.value)}
                      />
                      {errs.zip && <span className="help-error">{errs.zip}</span>}
                    </div>
                  </div>
                </div>

                {/* refund policy */}
                <h2 className="t-display-sm ink" style={{ marginBottom: 12 }}>
                  Cancellation policy
                </h2>
                <div
                  className="stack-md"
                  style={{
                    padding: 20,
                    background: 'var(--surface-soft)',
                    borderRadius: 'var(--r-md)',
                    marginBottom: 32,
                  }}
                >
                  <div className="row row-gap-sm">
                    <Icon name="shield" size={18} stroke="var(--ink)" />
                    <span className="t-body-sm body">
                      Free cancellation up to 24h before — full refund.
                    </span>
                  </div>
                  <div className="row row-gap-sm">
                    <Icon name="clock" size={18} stroke="var(--ink)" />
                    <span className="t-body-sm body">
                      Cancellations within 24h get a 50% refund.
                    </span>
                  </div>
                  <div className="row row-gap-sm">
                    <Icon name="lock" size={18} stroke="var(--ink)" />
                    <span className="t-body-sm body">
                      All payments are SSL-encrypted and secure.
                    </span>
                  </div>
                </div>

                <p
                  className="t-caption-sm muted"
                  style={{ marginBottom: 16, lineHeight: 1.6 }}
                >
                  By continuing, you agree to the Handled{' '}
                  <span style={{ textDecoration: 'underline', color: 'var(--ink)' }}>
                    Terms
                  </span>
                  ,{' '}
                  <span style={{ textDecoration: 'underline', color: 'var(--ink)' }}>
                    Privacy Policy
                  </span>
                  , and cancellation policy.
                </p>

                <button
                  className="btn btn-primary btn-block"
                  onClick={submit}
                  disabled={loading}
                  style={{ padding: 16, fontSize: 16, fontWeight: 600 }}
                >
                  {loading ? (
                    <>
                      <span className="spinner" /> Processing...
                    </>
                  ) : (
                    `Pay ${krw(booking.total)}`
                  )}
                </button>
              </div>

              {/* Summary */}
              <aside>
                <div
                  className="pay-summary-card"
                >
                  <div className="row row-gap-md" style={{ marginBottom: 16 }}>
                    <div
                      style={{
                        width: 92,
                        height: 92,
                        borderRadius: 'var(--r-md)',
                        overflow: 'hidden',
                        flexShrink: 0,
                      }}
                    >
                      <img
                        src={booking.experience ? booking.experience.photo : guide.photo}
                        alt={booking.experience ? booking.experience.title : guide.name}
                        style={{ width: '100%', height: '100%', objectFit: 'cover' }}
                      />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="t-caption muted">
                        {guide.city} · Guided by {guide.name}
                      </div>
                      <div className="t-title-md ink" style={{ marginTop: 2 }}>
                        {booking.experience
                          ? booking.experience.title
                          : `Custom tour with ${guide.name}`}
                      </div>
                      <div className="row row-gap-xs" style={{ marginTop: 4 }}>
                        <Stars rating={guide.rating} />
                        <span className="t-body-sm muted">({guide.reviews})</span>
                      </div>
                    </div>
                  </div>
                  <div className="divider" style={{ margin: '16px 0' }} />
                  <div className="t-display-sm ink" style={{ marginBottom: 16 }}>
                    Price details
                  </div>
                  <div className="stack-sm" style={{ marginBottom: 16 }}>
                    <div className="row between" style={{ gap: 8 }}>
                      <span
                        className="t-body-sm body"
                        style={{
                          flex: 1,
                          minWidth: 0,
                          overflow: 'hidden',
                          textOverflow: 'ellipsis',
                          whiteSpace: 'nowrap',
                        }}
                      >
                        {booking.experience
                          ? `${booking.experience.title}`
                          : `${krw(guide.hourlyRate)} × ${booking.hours}h`}
                      </span>
                      <span className="t-body-sm ink" style={{ flexShrink: 0 }}>
                        {krw(booking.subtotal)}
                      </span>
                    </div>
                    <div className="row between">
                      <span className="t-body-sm body">Service fee</span>
                      <span className="t-body-sm ink">{krw(booking.fee)}</span>
                    </div>
                  </div>
                  <div
                    className="row between"
                    style={{
                      paddingTop: 16,
                      borderTop: '1px solid var(--hairline-soft)',
                    }}
                  >
                    <span className="t-title-md ink">Total (KRW)</span>
                    <span className="t-display-sm ink">{krw(booking.total)}</span>
                  </div>
                </div>
              </aside>
            </div>
          </div>
        </main>
      );
    };

    /* ═══════════════════════════════════════════════
       CONFIRMATION SCREEN
       ═══════════════════════════════════════════════ */
    const ConfirmScreen = ({ booking, navigate }) => {
      useEffect(() => {
        const t = setTimeout(() => {
          // simple confetti-less celebration: noop
        }, 100);
        return () => clearTimeout(t);
      }, []);

      if (!booking) {
        return (
          <main className="fade-in">
            <div className="container" style={{ padding: '64px 0', textAlign: 'center' }}>
              <p className="t-body-md muted">Booking not found.</p>
              <button
                className="btn btn-secondary"
                onClick={() => navigate('home')}
                style={{ marginTop: 16 }}
              >
                Home
              </button>
            </div>
          </main>
        );
      }

      const { guide } = booking;

      return (
        <main className="fade-in">
          <div
            className="container"
            style={{
              padding: '64px 0',
              display: 'flex',
              justifyContent: 'center',
            }}
          >
            <div style={{ maxWidth: 560, width: '100%', textAlign: 'center' }}>
              {/* check icon */}
              <div
                style={{
                  width: 88,
                  height: 88,
                  borderRadius: '50%',
                  background: 'var(--rausch)',
                  display: 'inline-flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  margin: '0 auto 24px',
                  boxShadow: '0 12px 32px rgba(255, 56, 92, 0.25)',
                }}
              >
                <Icon name="check" size={44} stroke="white" sw={3} />
              </div>

              <h1 className="t-display-xl ink" style={{ marginBottom: 12 }}>
                Booking confirmed!
              </h1>
              <p
                className="t-body-md muted"
                style={{ marginBottom: 32, fontSize: 17 }}
              >
                {guide.name} will send a welcome message shortly.
              </p>

              {/* Booking summary card */}
              <div className="confirm-summary-card">
                <div
                  className="row row-gap-md"
                  style={{ marginBottom: 20, flexWrap: 'wrap' }}
                >
                  <Avatar src={guide.photo} alt={guide.name} name={guide.name} size={56} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="t-caption muted">Host</div>
                    <div className="t-title-md ink">{guide.name}</div>
                    <div className="t-caption-sm muted">
                      {guide.district}, {guide.city}
                    </div>
                  </div>
                  <span
                    className="badge-pill"
                    style={{
                      background: '#fff0f3',
                      color: 'var(--rausch)',
                      flexShrink: 0,
                    }}
                  >
                    {booking.experience ? 'Experience' : 'Custom tour'}
                  </span>
                </div>

                <div className="divider" style={{ margin: '0 0 20px' }} />

                <div className="stack-md">
                  {booking.experience && (
                    <SummaryRow
                      icon="sparkles"
                      label="Experience"
                      value={booking.experience.title}
                    />
                  )}
                  <SummaryRow
                    icon="calendar"
                    label="Date"
                    value={formatDate(booking.date)}
                  />
                  <SummaryRow
                    icon="clock"
                    label="Time"
                    value={`${booking.time} · ${booking.hours} hours`}
                  />
                  <SummaryRow
                    icon="users"
                    label="Guests"
                    value={`${booking.guests} ${booking.guests === 1 ? 'guest' : 'guests'}`}
                  />
                  {booking.interests && booking.interests.length > 0 && (
                    <SummaryRow
                      icon="award"
                      label="Interests"
                      value={booking.interests.join(' · ')}
                    />
                  )}
                  {booking.requests && (
                    <SummaryRow
                      icon="message"
                      label="Special requests"
                      value={booking.requests}
                    />
                  )}
                  <SummaryRow
                    icon="lock"
                    label="Payment"
                    value={`${krw(booking.total)} · Card ending in ${
                      booking.cardLast4 || '****'
                    }`}
                  />
                  <SummaryRow
                    icon="shield"
                    label="Booking ID"
                    value={booking.bookingId || 'HD-XXXXXX'}
                  />
                </div>
              </div>

              {/* email message */}
              <div
                className="row row-gap-sm"
                style={{
                  background: 'var(--surface-soft)',
                  borderRadius: 'var(--r-sm)',
                  padding: '16px 20px',
                  justifyContent: 'center',
                  marginBottom: 32,
                }}
              >
                <Icon name="mail" size={18} stroke="var(--ink)" />
                <span className="t-body-sm body">
                  We have emailed you a receipt.
                </span>
              </div>

              {/* CTA */}
              <button
                className="btn btn-primary"
                style={{ minWidth: 240, padding: '16px 32px' }}
                onClick={() => navigate('home')}
              >
                Back to home
              </button>
              <div style={{ marginTop: 12 }}>
                <button
                  className="btn-tertiary t-body-sm"
                  style={{ textDecoration: 'underline' }}
                  onClick={() => navigate('list')}
                >
                  Browse more guides
                </button>
              </div>
            </div>
          </div>
        </main>
      );
    };

    const SummaryRow = ({ icon, label, value }) => (
      <div className="row row-gap-md" style={{ alignItems: 'flex-start' }}>
        <Icon name={icon} size={18} stroke="var(--muted)" style={{ flexShrink: 0, marginTop: 2 }} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="t-caption muted">{label}</div>
          <div
            className="t-body-md ink"
            style={{ fontWeight: 500, overflowWrap: 'anywhere' }}
          >
            {value}
          </div>
        </div>
      </div>
    );

    /* ═══════════════════════════════════════════════
       APP — simple route state
       ═══════════════════════════════════════════════ */
    const App = () => {
      const [route, setRoute] = useState({ name: 'home' });
      const [booking, setBooking] = useState(null);

      const navigate = (name, params = {}) => {
        setRoute({ name, ...params });
        window.scrollTo({ top: 0, behavior: 'instant' });
      };

      const onReserve = (b) => {
        setBooking({ ...b });
        navigate('payment');
      };
      const onConfirm = (b) => {
        setBooking({ ...b });
        navigate('confirm');
      };

      let screen = null;
      if (route.name === 'home')
        screen = <HomeScreen navigate={navigate} />;
      else if (route.name === 'list')
        screen = (
          <ListScreen
            navigate={navigate}
            initialCity={route.initialCity}
            initialQuery={route.initialQuery}
          />
        );
      else if (route.name === 'experiences')
        screen = (
          <ExperiencesScreen
            navigate={navigate}
            initialCity={route.initialCity}
            initialCategory={route.initialCategory}
          />
        );
      else if (route.name === 'profile')
        screen = (
          <ProfileScreen
            navigate={navigate}
            guideId={route.guideId}
            onReserve={onReserve}
          />
        );
      else if (route.name === 'experience')
        screen = (
          <ExperienceDetailScreen
            navigate={navigate}
            expId={route.expId}
            onReserve={onReserve}
          />
        );
      else if (route.name === 'payment')
        screen = (
          <PaymentScreen
            navigate={navigate}
            booking={booking}
            onConfirm={onConfirm}
          />
        );
      else if (route.name === 'confirm')
        screen = <ConfirmScreen navigate={navigate} booking={booking} />;

      return (
        <>
          <TopNav navigate={navigate} route={route} />
          {screen}
          {route.name !== 'confirm' && <Footer />}
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
