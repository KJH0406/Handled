      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.93);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-up {
        animation: fadeUp 0.45s ease both;
      }
      .scale-in {
        animation: scaleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .slide-down {
        animation: slideDown 0.3s ease both;
      }

        height: 5px;
        border-radius: 9px;
        background: #eeeae4;

                          style={{
                            fontWeight: 700,
                            color: C.g900,
                            fontSize: 15,
                            marginTop: 6,
                            marginBottom: 4,
                            lineHeight: 1.3,
                          }}
                        >
                          {post.title}
                        </div>
                        <div style={{ fontSize: 12, color: C.g500 }}>
                          {post.date} · {post.readTime}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Category filter */}
              <div
                style={{
                  display: "flex",
                  gap: 8,
                  marginBottom: 36,
                  flexWrap: "wrap",
                }}
              >
                {BLOG_CATS.map((c) => (
                  <Pill key={c} active={cat === c} onClick={() => setCat(c)}>
                    {c}
                  </Pill>
                ))}
              </div>

              {/* Grid */}
              <div
                style={{
                  display: "grid",
                  gridTemplateColumns: "repeat(3,1fr)",
                  gap: 24,
                }}
              >
                {filtered.map((post, i) => (
                  <div
                    key={i}
                    className="fade-up"
                    style={{
                      borderRadius: 20,
                      overflow: "hidden",
                      background: C.w,
                      boxShadow: sh.sm,
                      cursor: "pointer",
                      transition: "transform .2s,box-shadow .2s",
                      animationDelay: `${i * 0.06}s`,
                    }}
                    onMouseEnter={(e) => {
                      e.currentTarget.style.transform = "translateY(-4px)"
                      e.currentTarget.style.boxShadow = sh.lg
                    }}
                    onMouseLeave={(e) => {
                      e.currentTarget.style.transform = "none"
                      e.currentTarget.style.boxShadow = sh.sm
                    }}
                  >
                    <div
                      style={{
                        height: 180,
                        background: post.bg,
                        position: "relative",
                      }}
                    >
                      <span
                        style={{
                          position: "absolute",
                          top: 14,
                          left: 14,
                          background: "rgba(255,255,255,.9)",
                          color: C.g700,
                          fontSize: 11,
                          fontWeight: 800,
                          padding: "4px 10px",
                          borderRadius: 999,
                        }}
                      >
                        {post.category}
                      </span>
                    </div>
                    <div style={{ padding: "18px 20px" }}>
                      <h3
                        style={{
                          fontWeight: 800,
                          fontSize: 16,
                          color: C.g900,
                          lineHeight: 1.35,
                          marginBottom: 8,
                        }}
                      >
                        {post.title}
                      </h3>
                      <p
                        style={{
                          color: C.g500,
                          fontSize: 13,
                          lineHeight: 1.65,
                          marginBottom: 14,
                        }}
                      >
                        {post.summary}
                      </p>
                      <div
                        style={{
                          display: "flex",
                          alignItems: "center",
                          gap: 8,
                          fontSize: 12,
                          color: C.g300,
                        }}
                      >
                        <span>{post.date}</span>
                        <span>·</span>
                        <span>{post.readTime}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {/* Bottom teaser */}
              <div
                style={{
                  textAlign: "center",
                  marginTop: 64,
                  padding: "48px 40px",
                  background: C.pDark,
                  borderRadius: 24,
                }}
              >
                <h3
                  style={{
                    color: C.w,
                    fontSize: 26,
                    fontWeight: 900,
                    marginBottom: 12,
                  }}
                >
                  More stories every week
                </h3>
                <p
                  style={{
                    color: "rgba(255,255,255,.65)",
                    fontSize: 15,
                    marginBottom: 24,
                  }}
                >
                  Follow Handled for the latest Korea travel guides, insider
                  tips, and cultural stories.
                </p>
                <Btn v="white">Subscribe to Korea Story</Btn>
              </div>
            </div>
          </div>
        )
      }

      /* ─── App ─── */
      const App = () => {
        const [screen, setScreen] = useState("home")
        const [pid, setPid] = useState(1)
        const [isLoggedIn, setIsLoggedIn] = useState(false)
        const [user, setUser] = useState(null)
        const [authMode, setAuthMode] = useState("signup")
        const [plannerInit, setPlannerInit] = useState({})

        const go = (s, id, extra) => {
          if (id !== undefined && id !== "_") setPid(Number(id))
          if (typeof extra === "string") {
            setAuthMode(extra)
          } else if (extra && typeof extra === "object") {
            setPlannerInit(extra)
          }
          setScreen(s)
          const el = document.getElementById("page-scroll")
          if (el) el.scrollTop = 0
        }

        const login = (userData) => {
          setIsLoggedIn(true)
          setUser(userData)
        }
        const logout = () => {
          setIsLoggedIn(false)
          setUser(null)
          setScreen("home")
        }

        const screens = {
          home: <HomeScreen go={go} isLoggedIn={isLoggedIn} />,
          "planner-input": (
            <PlannerInput
              go={go}
              isLoggedIn={isLoggedIn}
              user={user}
              plannerInit={plannerInit}
            />
          ),
          "planner-result": <PlannerResult go={go} />,
          "experience-browse": <ExperienceBrowse go={go} />,
          "experience-detail": <ExperienceDetail go={go} pid={pid} />,
          auth: <AuthScreen go={go} login={login} initMode={authMode} />,
          mypage: <MyPage go={go} user={user} logout={logout} />,
          "korea-story": <KoreaStory go={go} />,
        }

        return (
          <div style={{ height: "100vh", overflow: "hidden" }}>
            <NavBar
              screen={screen}
              go={go}
              isLoggedIn={isLoggedIn}
              user={user}
            />
            {screens[screen] || screens["home"]}
          </div>
        )
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />)
    </script>
  </body>
</html>
